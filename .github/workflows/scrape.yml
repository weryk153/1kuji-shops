name: scrape

on:
  schedule:
    - cron: '0 19 * * *'  # 每日 UTC 19:00 (= 台灣時間 03:00 隔日)
  workflow_dispatch:
  # PR 只在改到爬蟲核心邏輯時跑（避免 Cloudflare autoconfig 之類 PR 觸發長時間爬蟲）
  pull_request:
    branches: [main]
    paths:
      - 'scraper/**'
      - 'data/prefectures.json'

# 防止多個 scrape 同時打 1kuji（會 rate limit）。同 group 後到的會等前一個完成。
concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 360  # 視窗內預估 30-40 個 lottery × 3-8 分鐘 = 2-5 小時，留 buffer
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      - name: Run scraper
        run: npm run scrape

      - name: Commit if data changed (skip on PR)
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "No data changes, skipping commit."
          else
            git commit -m "data: scrape $(date -u +%Y-%m-%d)"
            git push
          fi
